  acceleration_percent: 20
  collision_level: 2
measurement:
  settle_sec: 2.0
  record_sec: 3.0
  repeats: 1
identify:
  assume_flat_mounting: true # Assume a level robot base; fit J1/J4 and J2/J3 posture terms independently.
